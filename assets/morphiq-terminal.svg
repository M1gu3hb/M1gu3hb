<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-label="Morphiq animated terminal logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060c"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#168cff"/>
      <stop offset="0.5" stop-color="#52b6ff"/>
      <stop offset="1" stop-color="#0068ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .dim { fill: #6f839b; }
      .white { fill: #dce8f5; }
      .blue { fill: url(#blue); filter: url(#glow); }
      .line { opacity: 0; }
      .l1 { animation: a1 11s linear infinite; }
      .l2 { animation: a2 11s linear infinite; }
      .l3 { animation: a3 11s linear infinite; }
      .l4 { animation: a4 11s linear infinite; }
      .l5 { animation: a5 11s linear infinite; }
      .l6 { animation: a6 11s linear infinite; }
      .l7 { animation: a7 11s linear infinite; }
      .l8 { animation: a8 11s linear infinite; }
      .l9 { animation: a9 11s linear infinite; }
      .l10 { animation: a10 11s linear infinite; }
      .l11 { animation: a11 11s linear infinite; }
      .l12 { animation: a12 11s linear infinite; }
      .l13 { animation: a13 11s linear infinite; }
      .l14 { animation: a14 11s linear infinite; }
      .cursor { animation: blink 0.85s steps(1) infinite; }
      @keyframes a1 {0%,2%{opacity:0}3%,92%{opacity:1}100%{opacity:0}}
      @keyframes a2 {0%,6%{opacity:0}7%,92%{opacity:1}100%{opacity:0}}
      @keyframes a3 {0%,10%{opacity:0}11%,92%{opacity:1}100%{opacity:0}}
      @keyframes a4 {0%,18%{opacity:0}19%,92%{opacity:1}100%{opacity:0}}
      @keyframes a5 {0%,22%{opacity:0}23%,92%{opacity:1}100%{opacity:0}}
      @keyframes a6 {0%,26%{opacity:0}27%,92%{opacity:1}100%{opacity:0}}
      @keyframes a7 {0%,30%{opacity:0}31%,92%{opacity:1}100%{opacity:0}}
      @keyframes a8 {0%,34%{opacity:0}35%,92%{opacity:1}100%{opacity:0}}
      @keyframes a9 {0%,38%{opacity:0}39%,92%{opacity:1}100%{opacity:0}}
      @keyframes a10 {0%,42%{opacity:0}43%,92%{opacity:1}100%{opacity:0}}
      @keyframes a11 {0%,46%{opacity:0}47%,92%{opacity:1}100%{opacity:0}}
      @keyframes a12 {0%,54%{opacity:0}55%,92%{opacity:1}100%{opacity:0}}
      @keyframes a13 {0%,62%{opacity:0}63%,92%{opacity:1}100%{opacity:0}}
      @keyframes a14 {0%,70%{opacity:0}71%,92%{opacity:1}100%{opacity:0}}
      @keyframes blink {0%,48%{opacity:1}49%,100%{opacity:0}}
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="568" rx="22" fill="url(#bg)" stroke="#1a3958" stroke-width="2"/>
  <rect x="1" y="1" width="1098" height="568" rx="22" fill="url(#scan)"/>
  <rect x="1" y="1" width="1098" height="50" rx="22" fill="#0b1625"/>
  <rect x="1" y="29" width="1098" height="22" fill="#0b1625"/>
  <circle cx="29" cy="25" r="7" fill="#ff5f57"/>
  <circle cx="53" cy="25" r="7" fill="#febc2e"/>
  <circle cx="77" cy="25" r="7" fill="#28c840"/>
  <text x="550" y="31" text-anchor="middle" class="mono dim" font-size="15">morphiq://profile/boot</text>

  <text x="38" y="82" class="mono white line l1" font-size="17">$ morphiq init --profile M1gu3hb</text>
  <text x="38" y="108" class="mono dim line l2" font-size="15">[OK] identity loaded  ·  systems online  ·  building from Mexico</text>
  <text x="38" y="134" class="mono dim line l3" font-size="15">[OK] full-stack · product systems · UI architecture · AI orchestration</text>

  <g class="mono blue" font-size="25" font-weight="700">
    <text x="275" y="192" class="line l4">╭────────────────────────────────────╮</text>
    <text x="275" y="222" class="line l5">│        ███╗   ███╗ ██╗  ██╗       │</text>
    <text x="275" y="252" class="line l6">│        ████╗ ████║ ██║  ██║       │</text>
    <text x="275" y="282" class="line l7">│        ██╔████╔██║ ███████║       │</text>
    <text x="275" y="312" class="line l8">│        ██║╚██╔╝██║ ██╔══██║       │</text>
    <text x="275" y="342" class="line l9">│        ██║ ╚═╝ ██║ ██║  ██║       │</text>
    <text x="275" y="372" class="line l10">│        ╚═╝     ╚═╝ ╚═╝  ╚═╝       │</text>
    <text x="275" y="402" class="line l11">╰────────────────────────────────────╯</text>
  </g>

  <text x="550" y="452" text-anchor="middle" class="mono blue line l12" font-size="42" font-weight="800" letter-spacing="9">MORPHIQ</text>
  <text x="550" y="486" text-anchor="middle" class="mono white line l13" font-size="15" letter-spacing="7">ASTRAL MORPHIQ SYSTEMS</text>
  <text x="38" y="535" class="mono dim line l14" font-size="16">$ ship systems that work in the real world<span class="cursor">_</span></text>
</svg>